# Yan's tmux config — survival-first, minimal magic
set -g mouse on              # wheel scrolls (enters copy mode), click selects panes
set -g history-limit 100000  # default is 2000 lines; benchmarks scroll a lot
set -g base-index 1          # windows number from 1, matching the keyboard row
setw -g pane-base-index 1
set -g renumber-windows on   # closing window 2 of 3 renumbers cleanly
set -g status-interval 5
# status bar: session name left, host + time right (know WHICH pod you're on)
set -g status-left "[#S] "
set -g status-right "#H %H:%M"
